name: helkki_staging

services:
  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    init: true
    env_file:
      - path: .env.staging
        required: true
    environment:
      APP_ENV: staging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CATALOG_MANIFEST_PATHS: "[]"
      LLM_ENABLED: "false"
      LLM_PROVIDER_CODE: NONE
      LLM_AGENTS_ENABLED: "false"
      LLM_AGENTS_PROVIDER_CODE: UNCONFIGURED
      LLM_AGENTS_MODEL_CODE: unconfigured
      LLM_AGENTS_APPROVED_MODEL_CODES: "[]"
      V3_LANGGRAPH_ENABLED: "false"
      V3_SHADOW_EVALUATION_ENABLED: "false"
      V3_REGENERATION_ENABLED: "false"
      V3_EXECUTION_PROFILE: LEGACY
      V3_PRODUCTION_PROMOTION_APPROVED: "false"
      # Fail-closed baseline only. Do not enable this plaintext in-Compose
      # endpoint until the staging Qdrant topology has the required approval.
      # Settings requires TLS and an API key whenever staging Qdrant is enabled.
      QDRANT_ENABLED: "false"
      QDRANT_URL: http://qdrant:6333
      QDRANT_TLS_ENABLED: "false"
      EMBEDDING_PROVIDER_CODE: UNCONFIGURED
      EMBEDDING_MODEL_VERSION: unconfigured
      EMBEDDING_VECTOR_DIMENSION: "0"
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  caddy:
    # Pinned by tag rather than digest: the operator resolves and pins the
    # digest for the release they actually deploy, the same way qdrant below is
    # pinned. Do not invent one here.
    image: caddy:2.10-alpine
    init: true
    environment:
      # Both are required. Caddy cannot request a certificate without a domain
      # that already resolves to this host, and ACME needs a contact address.
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.staging}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.staging}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Losing this volume means
      # re-requesting certificates on every restart, which hits the Let's
      # Encrypt rate limit quickly.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - caddy
        - version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3; [[ "$$status" == *"200 OK"* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  qdrant_data:
  caddy_data:
  caddy_config:
